name: Release

# One release per green build on master, tagged with the build's version:
#
#   https://github.com/<owner>/<repo>/releases/tag/v2.0.<run_number>
#
# Why this file exists: the build workflows only ever called `actions/upload-artifact`, which parks
# files under a *run* (and expires them after 30 days). Nothing ever called the Releases API, so
# nothing appeared on the Releases page no matter how green the build was. This workflow is that
# missing piece.
#
# Both platform builds run first - as reusable workflows, so each build's logic still lives in
# exactly one place - and only when BOTH are green does the publish job create the release. A
# failing build therefore leaves the previous release untouched, and the version it would have
# carried simply never appears. Because every release is a real version, the Releases page is a
# history of builds instead of a single entry that silently changes underneath you.
#
# The in-app updater reads `releases/latest`, i.e. whatever this job published most recently.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Serialise releases on a ref, so that a burst of pushes cannot interleave tag creation. Builds
# queue rather than cancel: a cancelled run never reaches the publish job, so that commit would
# silently have no release at all.
concurrency:
  group: release-${{ github.ref }}
  # Queue instead of cancel: a cancelled run never reaches the publish job, so that commit would
  # silently have no release. Builds are serialised, so each run publishes exactly one version.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installers
    uses: ./.github/workflows/desktop-windows.yml

  apk:
    name: Build Android APKs
    uses: ./.github/workflows/android.yml
    # A called workflow does not see the caller's secrets unless they are forwarded explicitly.
    # This is what keeps KEYSTORE_BASE64 / KEY_ALIAS / ... working inside android.yml, which would
    # otherwise silently skip the signed release APK.
    secrets: inherit

  publish:
    name: Publish the release
    needs: [windows, apk]
    runs-on: ubuntu-latest
    # The only job in the repo that can write to it. The build jobs above stay read-only.
    permissions:
      contents: write
    steps:
      - name: Download the Windows installers
        uses: actions/download-artifact@v4
        with:
          name: jm-reader-windows-installer
          path: dist

      - name: Download the Android APKs
        uses: actions/download-artifact@v4
        with:
          name: jm-reader-apk
          path: dist

      - name: Show what is about to be published
        run: ls -lh dist

      # Delete-then-create rather than `gh release upload --clobber`.
      #
      #   * `--clobber` would leave assets from an older commit sitting next to new ones whenever a
      #     filename changes, i.e. a release that is a mix of two builds.
      #   * Re-running the same workflow run reuses the same run_number, so the tag can already
      #     exist; deleting first makes a re-run idempotent instead of failing on "tag exists".
      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="2.0.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          notes=$(printf 'Build `%s` of `master`.\n\n| | |\n|---|---|\n| Version | `%s` |\n| Commit | `%s` |\n| Built | %s |\n| Event | `%s` |\n\nInstallers and the debug APK are attached below. The in-app updater reads\n`releases/latest`, so this build is offered to anyone who taps "check for updates".\n' \
            "$tag" "$version" "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$GITHUB_EVENT_NAME")
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "JMReader ${version}" \
            --latest \
            --notes "$notes"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"
