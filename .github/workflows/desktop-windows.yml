name: Desktop (Windows)

# Builds the Compose Multiplatform desktop app and packages it into Windows installers with the
# JDK's own jpackage. Runs on windows-latest because jpackage can only produce a Windows installer
# from a Windows host.
#
#   * .msi - Windows Installer package (silent-deployable, in-place upgrades via upgradeUuid)
#   * .exe - the same app wrapped in a setup wizard
#
# Both bundle a runtime, so the target machine does not need Java installed.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    # jpackage shells out to a *separate* JVM, so it does not inherit the -Dfile.encoding=UTF-8
    # that gradle.properties sets for Gradle itself - it picks up the runner's ANSI code page
    # (windows-1252) instead. The installer strings in desktop/build.gradle.kts are non-ASCII and
    # jpackage feeds them straight into the WiX sources it generates, so a mismatch there does not
    # surface as an encoding error; it surfaces much later as a candle/light failure. Pinning the
    # encoding for every JVM in the job removes the variable rather than working around it.
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # jpackage refuses to run on anything older than 17. The build's toolchain is pinned to
          # 17 in desktop/build.gradle.kts, so this also satisfies the toolchain lookup.
          java-version: '17'
          cache: gradle

      # jpackage shells out to WiX for BOTH the .msi and the .exe; the linker (light.exe) is what
      # fails when the toolchain is wrong, and Gradle only reports "External tool execution
      # failed ... Exit code: 1", which names the tool but not the reason. So require *both*
      # executables (a half-present WiX is a real failure mode) and install 3.x when either is
      # missing - jpackage cannot use WiX 4/5, which replaced these two with a single wix.exe.
      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          $missing = @()
          foreach ($tool in 'candle.exe', 'light.exe') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += $tool }
          }
          if ($missing.Count -eq 0) {
            Write-Host "WiX already on PATH (candle.exe + light.exe)"
          } else {
            Write-Host "Missing WiX tools: $($missing -join ', ') - installing WiX 3.14 via Chocolatey"
            choco install wixtoolset --version 3.14.1 --no-progress -y
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      # jpackage locates WiX by scanning PATH. The Compose plugin does *not* consult PATH when
      # deciding where WiX is: it downloads the pinned wix3112rtm release (2019, .NET Framework
      # 3.5 era - see its task :downloadWix, which runs in this build) and prepends that
      # directory to PATH for the jpackage child process, shadowing the newer WiX the runner
      # image already ships. Setting WIX_PATH makes the plugin skip the download and hand
      # jpackage the toolchain verified here instead, so "which WiX actually ran" stops being a
      # variable. The plugin reads WIX_PATH at configuration time, so it must be exported
      # before Gradle starts.
      - name: Pin and report the WiX toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dirs = @()
          foreach ($tool in 'candle.exe', 'light.exe') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) {
              Write-Host "::warning::$tool is not on PATH"
              continue
            }
            $dirs += Split-Path -Parent $cmd.Source
            Write-Host "$tool -> $($cmd.Source)"
            # WiX prints its version as the first line of its usage text.
            & $cmd.Source '-?' 2>&1 | Select-Object -First 2 | ForEach-Object { Write-Host "    $_" }
          }
          $unique = @($dirs | Sort-Object -Unique)
          if ($dirs.Count -eq 2 -and $unique.Count -eq 1) {
            # UTF-8 without a BOM - the runner parses this file line by line.
            [System.IO.File]::AppendAllText(
              $env:GITHUB_ENV, "WIX_PATH=$($unique[0])`n", [System.Text.UTF8Encoding]::new($false))
            Write-Host "WIX_PATH pinned to $($unique[0])"
          } else {
            Write-Host "::warning::cannot pin WIX_PATH (candle/light missing, or in different dirs) - the Compose plugin will download its own WiX 3.11"
          }
          Write-Host "JAVA_HOME = $env:JAVA_HOME"
          Write-Host "JAVA_TOOL_OPTIONS = $env:JAVA_TOOL_OPTIONS"
          & "$env:JAVA_HOME\bin\jpackage.exe" --version 2>&1 | ForEach-Object { Write-Host "jpackage $_" }
          # The version probes above exit non-zero by design; this step only reports.
          exit 0

      # Pure-logic tests: JM id parsing, de-scramble strip geometry, version comparison, HTML
      # stripping, the crypto round trip and the three-language string table. No network needed.
      - name: Unit tests
        run: .\gradlew.bat --no-daemon --stacktrace :desktop:test

      - name: Package MSI and EXE
        shell: pwsh
        run: |
          # Tee the output so the diagnostics step below can quote its tail, then re-raise the real
          # exit code: a pipeline would otherwise mask it, and a silently green packaging step is
          # worse than a red one.
          .\gradlew.bat --no-daemon --stacktrace :desktop:packageMsi :desktop:packageExe 2>&1 |
            Tee-Object -FilePath packaging.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "gradlew exited with $code"
            exit $code
          }

          # Belt and braces: a "successful" packaging run that produced no installer is a failure.
          $built = Get-ChildItem -Path desktop\build\compose\binaries -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.msi', '.exe' }
          if (-not $built) {
            Write-Host "::error::gradle reported success but no .msi/.exe exists under desktop\build\compose\binaries"
            exit 1
          }
          $built | Select-Object Name, Length | Out-String | Write-Host

      # Gradle never explains a jpackage failure: the whole message is
      #   "External tool execution failed ... Exit code: 1"
      # pointing at log files that live in the build directory. jpackage's own stderr is the only
      # place the cause appears, so it is surfaced FIRST, on its own annotation: annotations land in
      # the run summary and the Checks API, both readable without a signed-in session, which the
      # step log is not. Everything after it is context.
      - name: Packaging diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'desktop\build\compose'

          # Command properties are comma separated, so the titles below contain no commas.
          function Write-Annotation([string]$title, [string[]]$lines) {
            $body = ($lines -join "`n")
            if ($body.Length -gt 6000) {
              # Keep both ends: the head carries the top-level error, the tail the tool's stderr.
              $body = $body.Substring(0, 2000) + "`n[... truncated ...]`n" + $body.Substring($body.Length - 3800)
            }
            $body = $body.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::error title=$title::$body"
          }

          # Emits one line at a time so callers can pipe it straight into a List[string].Add.
          function Read-Head([string]$path, [int]$max) {
            if (-not (Test-Path -LiteralPath $path)) { "<missing: $path>"; return }
            Get-Content -LiteralPath $path -TotalCount $max -ErrorAction SilentlyContinue |
              ForEach-Object { [string]$_ }
          }

          # --- 1. jpackage's own stderr. This is the answer. -----------------------------
          # The plugin writes it to logs\<task>\jpackage-<timestamp>-err.txt. The unpacked JRE image
          # under tmp\main\runtime is thousands of irrelevant files, so it is excluded outright.
          $errFiles = @(Get-ChildItem -Path $root -Recurse -File -Filter '*-err.txt' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\runtime\\' })
          Write-Host "jpackage stderr logs found: $($errFiles.Count)"

          $primary = New-Object System.Collections.Generic.List[string]
          foreach ($f in $errFiles) {
            $primary.Add("===== $($f.FullName) ($($f.Length) bytes) =====")
            Read-Head $f.FullName 400 | ForEach-Object { $primary.Add($_) }
          }
          if ($primary.Count -eq 0) {
            $primary.Add('jpackage wrote no stderr log - the failure was not raised inside jpackage.')
          }
          $primary | ForEach-Object { Write-Host $_ }
          Write-Annotation 'jpackage stderr' $primary.ToArray()

          # --- 2. Context: what was asked for, what was generated, what toolchain exists. --
          $context = New-Object System.Collections.Generic.List[string]
          $context.Add('--- jpackage argument files (what the plugin actually asked for) ---')
          $argFiles = @(Get-ChildItem -Path $root -Recurse -File -Filter '*.args.txt' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\runtime\\' })
          foreach ($f in $argFiles) {
            $context.Add("===== $($f.FullName) =====")
            Read-Head $f.FullName 200 | ForEach-Object { $context.Add($_) }
          }

          $context.Add('--- generated WiX sources ---')
          $wxs = @(Get-ChildItem -Path $root -Recurse -File -Filter '*.wxs' -ErrorAction SilentlyContinue)
          if ($wxs.Count -eq 0) {
            $context.Add('(none under desktop\build\compose - jpackage writes them into its own temp dir)')
          }
          foreach ($f in $wxs) {
            $context.Add("===== $($f.FullName) ($($f.Length) bytes) =====")
            Read-Head $f.FullName 120 | ForEach-Object { $context.Add($_) }
          }

          $context.Add('--- toolchain visible to jpackage ---')
          $context.Add("WIX_PATH = " + [Environment]::GetEnvironmentVariable('WIX_PATH'))
          foreach ($tool in 'candle.exe', 'light.exe', 'heat.exe') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            $where = if ($cmd) { $cmd.Source } else { 'NOT ON PATH' }
            $context.Add("$tool -> $where")
          }
          $wixOnPath = @(($env:PATH -split ';') | Where-Object { $_ -match 'wix' })
          $context.Add('PATH entries mentioning wix: ' + $(if ($wixOnPath.Count) { $wixOnPath -join ' | ' } else { '(none)' }))
          # When WIX_PATH is unset the plugin unzips its own wix311 under the root build dir; if that
          # ends up with a nested wix311-binaries\ level, PATH never sees candle.exe.
          foreach ($d in 'build\wix311', 'wix311') {
            if (Test-Path -LiteralPath $d) {
              $exes = @(Get-ChildItem -Path $d -Recurse -File -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 8)
              $rel = @($exes | ForEach-Object { $_.FullName.Substring((Resolve-Path -LiteralPath $d).Path.Length) })
              $context.Add("$d exists; executables: " + $(if ($rel.Count) { $rel -join ', ' } else { '(none)' }))
            } else {
              $context.Add("$d does not exist")
            }
          }
          $context | ForEach-Object { Write-Host $_ }
          Write-Annotation 'jpackage context' $context.ToArray()

          # --- 3. Tail of the Gradle output, which names the failing task. ----------------
          $gradle = New-Object System.Collections.Generic.List[string]
          if (Test-Path packaging.log) {
            $gradle.Add('===== tail of packaging.log =====')
            Get-Content packaging.log -Tail 80 | ForEach-Object { $gradle.Add([string]$_) }
          } else {
            $gradle.Add('packaging.log not found')
          }
          $gradle | ForEach-Object { Write-Host $_ }
          Write-Annotation 'gradle output tail' $gradle.ToArray()

          # Diagnostics must never themselves become the thing that obscures a run.
          exit 0

      - name: Upload packaging logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jm-reader-packaging-logs
          path: |
            packaging.log
            desktop/build/compose/logs/**
            desktop/build/compose/tmp/**
          if-no-files-found: warn
          retention-days: 7

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $root = "desktop\build\compose\binaries\main"
          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            ForEach-Object {
              $name = "JMReader-$($_.Extension.TrimStart('.'))-$($env:GITHUB_SHA.Substring(0,7))$($_.Extension)"
              Copy-Item $_.FullName -Destination (Join-Path "artifacts" $name)
            }
          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: jm-reader-windows-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
