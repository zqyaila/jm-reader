name: Android CI

# Builds the Android artifacts and makes them downloadable from the run's "Artifacts" section.
#
#   * debug APK   - always built; installs side by side with a release build
#   * release APK - built only when the signing secrets are configured (see README); without them
#                   `assembleRelease` would only produce an unsigned APK of little use
#   * unit tests  - the pure-logic suite under app/src/test
#
# Triggered directly by pull requests (as a build check) and, for pushes to master, as a *reusable
# workflow* from release.yml - which is what actually publishes these APKs to the `latest` release.
# It deliberately does NOT trigger on `push` by itself any more: the same build running twice per
# push would mean two sets of artifacts and a release job racing itself.
#
# There is also deliberately no `concurrency` block here. A called workflow inherits the caller's
# name/ref, so a group of `${{ github.workflow }}-${{ github.ref }}` would be *identical* for the
# caller's two build jobs, and `cancel-in-progress` would make one cancel the other. The only
# concurrency control is in release.yml, where it is scoped to the real unit of work.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    # A step-level `if` cannot read the `secrets` context, so the "are signing secrets present?"
    # check is pre-computed into a plain string here and tested as `env.HAS_KEYSTORE == 'true'`.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner image ships an Android SDK whose licenses are already accepted.
      # This step adds compileSdk 36 if the image does not have it yet; when no
      # sdkmanager is found the Android Gradle Plugin downloads it on demand.
      # The debug keystore is a secret, not a committed file: the repository is public, and anyone
      # holding that key could sign an APK the installer would accept as an update for
      # com.jm.reader. It is restored here so every debug build shares one signature - which is the
      # whole precondition for in-app updates (Android rejects an APK signed by a different key).
      #
      # Failing loudly on a missing secret is deliberate: silently falling back to a throwaway key
      # would publish an APK that cannot be installed over the previous one, and the only symptom
      # would be an installer error on the user's phone.
      - name: Restore the debug keystore
        run: |
          if [ -z "${DEBUG_KEYSTORE_BASE64}" ]; then
            echo "::error::Repository secret DEBUG_KEYSTORE_BASE64 is not set - refusing to build an APK that cannot be upgraded in place."
            exit 1
          fi
          printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 --decode > debug.keystore
          ls -l debug.keystore

      - name: Ensure Android SDK platform 36
        run: |
          # Failures here are not fatal: Gradle downloads missing SDK packages itself.
          SDKMANAGER="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found - letting Gradle resolve the SDK packages"
          fi

      - name: Unit tests
        run: |
          # The wrapper is committed without the executable bit, so set it here.
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      # Tripwire for the one failure mode that is invisible until an update is attempted: the APK
      # being signed by some other key. Compared against the certificate the shipped builds use.
      - name: Verify the debug APK signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)"
          DIGEST="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -n1)"
          echo "APK signer SHA-256: $DIGEST"
          EXPECTED=ea12034bfb1888a4f98412a484da604fc132d62eeaf038dc2db6c9cd10ee8a32
          if [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the shared debug key (expected $EXPECTED) - updates would be rejected by the installer."
            exit 1
          fi

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > jmreader.keystore
          ls -l jmreader.keystore

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          JMREADER_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JMREADER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JMREADER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          # Asset names are deliberately version- and sha-free: the updater resolves them from the
          # release JSON, so a stable name keeps old links working while the tag changes every
          # build. The version and commit are recorded in the release notes instead.
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/JMReader-android-debug.apk"
          if [ -d app/build/outputs/apk/release ]; then
            find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' \
              -exec cp {} "artifacts/JMReader-android-release.apk" \; || true
          fi
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jm-reader-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
